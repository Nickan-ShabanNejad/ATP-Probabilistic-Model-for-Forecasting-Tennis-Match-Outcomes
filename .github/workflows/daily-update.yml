      - name: Commit refreshed model, histories, and health metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/generated/player_state.csv.gz \
            data/generated/head_to_head.csv.gz \
            data/tournament_surface_speed.csv \
            data/generated/current_rankings.csv \
            data/generated/freshness.json \
            data/generated/metrics.json \
            data/generated/source_history.csv \
            data/generated/model_history.csv \
            model/model.joblib

          if git diff --cached --quiet; then
            echo "No deployable artifact changes to commit"
            exit 0
          fi

          git commit -m "Daily ATP production refresh"

          # Remove temporary downloaded/generated changes that are not
          # supposed to be committed, so the rebase can run cleanly.
          git restore .
          git clean -fd

          git pull --rebase origin main
          git push origin main
