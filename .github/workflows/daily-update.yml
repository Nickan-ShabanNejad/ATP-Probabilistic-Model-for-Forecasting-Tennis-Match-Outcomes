name: Daily ATP data and model update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
      timezone: "America/Toronto"

permissions:
  contents: write

concurrency:
  group: atp-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Download matches and retrain
        run: python scripts/update_data.py
      - name: Verify generated files
        run: |
          test -s data/generated/player_state.csv.gz
          test -s model/model.joblib
      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/player_state.csv.gz model/model.joblib
          git diff --cached --quiet || git commit -m "Daily ATP model refresh"
          git push
