
name: Daily ATP multi-source refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: atp-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run existing smoke tests
        run: pytest -q

      - name: Download, merge, retrain
        run: python scripts/update_data.py

      - name: Verify generated artifacts
        run: |
          test -s data/generated/master_matches.csv.gz
          test -s data/generated/current_rankings.csv
          test -s data/generated/player_state.csv.gz
          test -s data/generated/freshness.json
          test -s data/generated/metrics.json
          test -s model/model.joblib
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          root=Path(".")
          state=pd.read_csv(root/"data/generated/player_state.csv.gz")
          assert len(state)>100
          assert state["overall_elo"].notna().all()
          meta=json.loads((root/"data/generated/freshness.json").read_text())
          assert meta["matches"]["master_rows"]>1000
          print("state rows:",len(state))
          print("latest match:",meta["matches"]["latest_tourney_date"])
          print("ranking date:",meta["reference"]["rankings"].get("ranking_date"))
          PY

      - name: Commit refreshed model and compact outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/generated/player_state.csv.gz \
            data/generated/current_rankings.csv \
            data/generated/freshness.json \
            data/generated/metrics.json \
            model/model.joblib
          git diff --cached --quiet || git commit -m "Daily ATP multi-source model refresh"
          git push
