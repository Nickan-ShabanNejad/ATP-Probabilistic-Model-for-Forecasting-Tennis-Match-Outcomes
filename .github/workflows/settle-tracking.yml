name: ATP prediction settlement

on:
  workflow_dispatch:

  schedule:
    # Run once every hour.
    - cron: "17 * * * *"

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Grade predictions and bets
        env:
          MATCHSTAT_API_KEY: ${{ secrets.MATCHSTAT_API_KEY }}
          PINNODDS_API_KEY: ${{ secrets.PINNODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          APP_TIMEZONE: "America/Toronto"
          MATCHSTAT_MIN_INTERVAL: "0.66"

        run: python scripts/settle_tracking.py
