services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: atp
      POSTGRES_USER: atp
      POSTGRES_PASSWORD: atp
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql+psycopg://atp:atp@db:5432/atp
    depends_on:
      - db
volumes:
  postgres_data:
